<style>
  :root{
    --navy:#0A1420;
    --navy-2:#0E1B2B;
    --panel:#0F2530;
    --panel-2:#123B3D;
    --teal:#1B5457;
    --teal-bright:#2C8C82;
    --gold:#C9A961;
    --gold-bright:#E4C77E;
    --text:#EAEEF2;
    --text-dim:#8291A3;
    --danger:#D96B6B;
    --ok:#6FBF8B;
    --line:rgba(201,169,97,0.18);
    --radius:14px;
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 15% -10%, #102232 0%, var(--navy) 45%, #060C13 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Cinzel',serif; letter-spacing:0.02em;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold); color:#0A1420;}

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    background:rgba(10,20,32,0.7);
    backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:50;
  }
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .brand svg{height:34px; width:auto;}
  .brand .word{font-family:'Cinzel',serif; font-size:1.15rem; font-weight:700; letter-spacing:0.12em; color:var(--text);}
  .brand .sub{display:block; font-family:'Inter'; font-size:0.62rem; letter-spacing:0.14em; color:var(--gold); text-transform:uppercase; margin-top:2px;}
  nav.mainnav{display:flex; align-items:center; gap:8px;}
  .navlink{
    padding:9px 16px; border-radius:999px; font-size:0.85rem; font-weight:600;
    color:var(--text-dim); transition:all .2s ease; cursor:pointer; border:1px solid transparent;
  }
  .navlink:hover{color:var(--text); border-color:var(--line);}
  .navlink.active{color:var(--navy); background:var(--gold); }
  .navlink.ghost{border:1px solid var(--line); color:var(--text);}

  /* ---------- Disclaimer / pulse divider ---------- */
  .pulse-strip{
    position:relative;
    background:linear-gradient(180deg, rgba(27,84,87,0.35), rgba(10,20,32,0));
    border-bottom:1px solid var(--line);
    padding:10px 32px 16px;
    overflow:hidden;
  }
  .disclaimer{
    display:flex; align-items:center; gap:10px;
    max-width:920px; margin:0 auto 8px;
    font-size:0.8rem; color:var(--gold-bright);
    text-align:center; justify-content:center; line-height:1.5;
  }
  .disclaimer b{color:var(--text);}
  .pulse-line{width:100%; height:26px; display:block;}
  .pulse-path{
    fill:none; stroke:var(--teal-bright); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray: 900; stroke-dashoffset:900;
    animation: pulse-draw 3.4s linear infinite;
    filter: drop-shadow(0 0 6px rgba(44,140,130,0.55));
  }
  @keyframes pulse-draw{
    0%{stroke-dashoffset:900;}
    60%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-20;}
  }

  main{flex:1; padding:48px 24px 80px;}
  .container{max-width:1080px; margin:0 auto;}
  .container.narrow{max-width:480px;}
  .container.medium{max-width:720px;}

  /* ---------- Hero ---------- */
  .hero{text-align:center; padding:40px 0 20px;}
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:0.72rem; letter-spacing:0.18em;
    color:var(--gold); text-transform:uppercase; border:1px solid var(--line); padding:6px 14px; border-radius:999px;
    margin-bottom:22px;
  }
  .hero h1{font-size:clamp(2rem,5vw,3.4rem); margin:0 0 16px; line-height:1.15;}
  .hero h1 .accent{color:var(--gold-bright);}
  .hero p{color:var(--text-dim); font-size:1.05rem; max-width:560px; margin:0 auto 32px; line-height:1.7;}
  .hero-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}

  .btn{
    padding:13px 26px; border-radius:10px; font-weight:700; font-size:0.92rem; cursor:pointer;
    border:1px solid transparent; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    display:inline-flex; align-items:center; gap:8px; font-family:'Inter';
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#161006; box-shadow:0 10px 30px -10px rgba(201,169,97,0.55);}
  .btn-gold:hover{box-shadow:0 14px 34px -8px rgba(201,169,97,0.7);}
  .btn-ghost{background:transparent; color:var(--text); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold-bright);}
  .btn-danger{background:rgba(217,107,107,0.12); color:var(--danger); border-color:rgba(217,107,107,0.4);}
  .btn-block{width:100%; justify-content:center;}
  .btn-sm{padding:8px 14px; font-size:0.8rem;}

  /* ---------- Cards / stats ---------- */
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:44px 0;}
  @media(max-width:760px){.grid3{grid-template-columns:1fr;}}
  .stat-card{
    background:linear-gradient(160deg, var(--panel), var(--navy-2));
    border:1px solid var(--line); border-radius:var(--radius); padding:24px;
    transition:transform .2s ease, border-color .2s ease;
  }
  .stat-card:hover{transform:translateY(-3px); border-color:var(--gold);}
  .stat-card .num{font-family:'Cinzel'; font-size:2rem; color:var(--gold-bright);}
  .stat-card .lbl{color:var(--text-dim); font-size:0.85rem; margin-top:4px;}

  .card{
    background:linear-gradient(160deg, var(--panel), var(--navy-2));
    border:1px solid var(--line); border-radius:var(--radius); padding:32px;
    box-shadow:var(--shadow);
  }
  .card h2{margin-top:0; font-size:1.4rem;}
  .card h3{font-size:1.05rem; margin-bottom:6px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:0.8rem; color:var(--text-dim); margin-bottom:7px; letter-spacing:0.02em;}
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line);
    background:rgba(255,255,255,0.03); color:var(--text); font-family:'Inter'; font-size:0.95rem;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,169,97,0.15);
  }
  .field textarea{min-height:260px; font-family:'ui-monospace',monospace; font-size:0.85rem; line-height:1.6; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  .hint{font-size:0.78rem; color:var(--text-dim); margin-top:6px; line-height:1.5;}
  .form-foot{margin-top:22px; text-align:center; font-size:0.85rem; color:var(--text-dim);}
  .form-foot a{color:var(--gold-bright); font-weight:600; cursor:pointer;}

  .format-box{
    background:rgba(201,169,97,0.06); border:1px dashed var(--line); border-radius:10px;
    padding:16px 18px; font-size:0.82rem; color:var(--text-dim); margin-bottom:20px; line-height:1.6;
  }
  .format-box code{display:block; white-space:pre-wrap; color:var(--teal-bright); font-family:'ui-monospace',monospace; margin-top:8px; font-size:0.8rem;}

  /* ---------- Quiz list ---------- */
  .quiz-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 20px; border:1px solid var(--line); border-radius:12px; margin-bottom:12px;
    background:rgba(255,255,255,0.02); flex-wrap:wrap;
  }
  .quiz-row .title{font-weight:700; font-size:1rem;}
  .quiz-row .meta{color:var(--text-dim); font-size:0.78rem; margin-top:4px;}
  .link-pill{
    display:flex; align-items:center; gap:8px; background:rgba(27,84,87,0.25); border:1px solid var(--line);
    padding:8px 12px; border-radius:999px; font-size:0.76rem; color:var(--teal-bright); max-width:320px; overflow:hidden;
  }
  .link-pill span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- Quiz taking ---------- */
  .qcard{border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:16px; background:rgba(255,255,255,0.02);}
  .qcard .qnum{color:var(--gold); font-size:0.75rem; font-weight:700; letter-spacing:0.1em; margin-bottom:8px;}
  .qcard .qtext{font-size:1rem; margin-bottom:14px; line-height:1.5;}
  .opt{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--line); border-radius:9px;
    margin-bottom:8px; cursor:pointer; transition:all .15s ease; font-size:0.9rem;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.selected{border-color:var(--gold); background:rgba(201,169,97,0.1); color:var(--gold-bright);}
  .progress-wrap{position:sticky; top:78px; z-index:10; padding:10px 0 18px; background:linear-gradient(180deg, var(--navy) 60%, transparent);}
  .progress-track{height:6px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--teal-bright), var(--gold)); transition:width .3s ease;}

  .score-hero{text-align:center; padding:50px 20px;}
  .score-hero .big{font-family:'Cinzel'; font-size:4rem; color:var(--gold-bright);}

  /* ---------- Table (admin) ---------- */
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  th,td{text-align:left; padding:12px 10px; border-bottom:1px solid var(--line);}
  th{color:var(--text-dim); font-weight:600; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .mini-input{width:64px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--text); font-size:0.82rem;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--panel-2); border:1px solid var(--gold); color:var(--text); padding:13px 22px; border-radius:10px;
    font-size:0.88rem; box-shadow:var(--shadow); z-index:200; transition:all .25s ease; pointer-events:none; max-width:90vw;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.error{border-color:var(--danger); color:#F3B4B4;}

  footer{
    border-top:1px solid var(--line); padding:26px 32px; text-align:center; color:var(--text-dim); font-size:0.8rem;
  }
  footer .foot-brand{color:var(--gold-bright); font-weight:700; font-family:'Cinzel';}
  footer a.foot-link{color:var(--teal-bright); font-weight:600;}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.68rem; font-weight:700; letter-spacing:0.05em;}
  .badge.admin{background:rgba(201,169,97,0.15); color:var(--gold-bright); border:1px solid var(--gold);}
  .badge.limit{background:rgba(255,255,255,0.05); color:var(--text-dim); border:1px solid var(--line);}

  .empty{text-align:center; padding:50px 20px; color:var(--text-dim);}

  @media (prefers-reduced-motion: reduce){
    .pulse-path{animation:none; stroke-dashoffset:0;}
    .stat-card:hover{transform:none;}
  }
  @media(max-width:640px){
    header.topbar{padding:14px 16px; flex-wrap:wrap; gap:10px;}
    nav.mainnav{gap:4px;}
    .navlink{padding:8px 12px; font-size:0.78rem;}
    main{padding:28px 14px 60px;}
    .card{padding:22px;}
  }
</style>
</head>

<script>
/* =========================================================
   CONFIG — paste your Apps Script Web App URL below
========================================================= */
const CONFIG = {
  SCRIPT_URL: 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE',
  OMAC_SITE: 'https://syedbaqir291-debug.github.io/OMAC/'
};

/* ---------------- utilities ---------------- */
async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function api(action, payload){
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}
async function apiGet(action, params){
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${CONFIG.SCRIPT_URL}?${qs}`);
  return res.json();
}

function toast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> el.className = '', 3400);
}

function session(){
  try{ return JSON.parse(localStorage.getItem('omac_quiz_session')||'null'); }catch(e){ return null; }
}
function setSession(obj){ localStorage.setItem('omac_quiz_session', JSON.stringify(obj)); }
function clearSession(){ localStorage.removeItem('omac_quiz_session'); }

/* ---------------- Header ---------------- */
function renderHeader(active){
  const s = session();
  const links = [];
  links.push(`<span class="navlink ${active==='home'?'active':''}" onclick="go('#/')">Home</span>`);
  if (s){
    links.push(`<span class="navlink ${active==='dashboard'?'active':''}" onclick="go('#/dashboard')">Dashboard</span>`);
    links.push(`<span class="navlink ${active==='upload'?'active':''}" onclick="go('#/upload')">New Quiz</span>`);
    links.push(`<span class="navlink ${active==='myquizzes'?'active':''}" onclick="go('#/my-quizzes')">My Quizzes</span>`);
    if (s.user.isAdmin) links.push(`<span class="navlink ${active==='admin'?'active':''}" onclick="go('#/admin')">Admin</span>`);
    links.push(`<span class="navlink ghost" onclick="doLogout()">Log out</span>`);

function parseQuizText(raw){
  const lines = raw.replace(/\r\n/g,'\n').split('\n');
  const blocks = [];
  let current = { qLines:[], options:[] };
  const pushIfReady = () => {
    if(current.qLines.length){
      blocks.push(current);
    }
    current = { qLines:[], options:[] };
  };
  lines.forEach(line=>{
    const t = line.trim();
    if(!t){ return; }
    const ansMatch = t.match(/^answer\s*[:\-]\s*(.+)$/i);
    if(ansMatch){
      current.answer = ansMatch[1].trim();
      pushIfReady();
      return;
    }
    const optMatch = t.match(/^([A-Da-d])[\)\.\-]\s*(.+)$/);
    if(optMatch){
      current.options.push({ key:optMatch[1].toUpperCase(), text:optMatch[2].trim() });
      return;
    }
    current.qLines.push(t.replace(/^Q\d*[\)\.\:]?\s*/i,''));
  });
  const questions = blocks
    .filter(b => b.qLines.length && b.answer)
    .map(b => ({
      q: b.qLines.join(' '),
      options: b.options.length ? b.options.map(o=>`${o.key}) ${o.text}`) : null,
      answer: b.answer
    }));
  return questions;
}

async function viewTakeQuiz(quizId){
  shell('take', `<div class="container medium"><div class="card"><div class="empty">Loading quiz…</div></div></div>`);
  let data;
  try{ data = await apiGet('getQuizForTaking', { quizId }); }
  catch(e){ shell('take', `<div class="container medium"><div class="card"><div class="empty">Couldn't reach OMAC servers. Check your connection.</div></div></div>`); return; }

  if(!data.ok){
    shell('take', `<div class="container medium"><div class="card"><div class="empty">${data.error}</div></div></div>`);
    return;
  }

  const answers = new Array(data.questions.length).fill(null);
  renderTakeForm();

  function renderTakeForm(){
    shell('take', `
      <div class="container medium">
        <div class="card" style="margin-bottom:0;">
          <h2 style="margin-bottom:2px;">${escapeHtml(data.title)}</h2>
          <p class="hint" style="margin-bottom:20px;">${data.questionCount} questions · answer authenticity is set by the quiz creator, not verified by OMAC.</p>
          <div class="field"><label>Your name (shown on the results)</label><input id="takerName" placeholder="Optional"></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
        </div>
        <div id="qList"></div>
        <button class="btn btn-gold btn-block" id="submitBtn">Submit Quiz</button>
      </div>
    `);
    const qList = document.getElementById('qList');
    qList.innerHTML = data.questions.map((q,i)=>`
      <div class="qcard">
        <div class="qnum">Question ${i+1} of ${data.questions.length}</div>
        <div class="qtext">${escapeHtml(q.q)}</div>
        ${q.options
          ? q.options.map((opt,oi)=>`<div class="opt" data-idx="${i}" data-val="${escapeHtml(opt.match(/^[A-D]\)/)?opt[0]:opt)}" onclick="selectOpt(this,${i})">${escapeHtml(opt)}</div>`).join('')
          : `<input class="freeAnswer" data-idx="${i}" placeholder="Type your answer" oninput="freeAnswerInput(this,${i})">`
        }
      </div>
    `).join('');
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
  }

  window.selectOpt = (el, idx) => {
    document.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    const letter = el.textContent.trim().match(/^([A-D])\)/);
    answers[idx] = letter ? letter[1] : el.dataset.val;
    updateProgress();
  };
  window.freeAnswerInput = (el, idx) => { answers[idx] = el.value; updateProgress(); };

  function updateProgress(){
    const answered = answers.filter(a => a !== null && a !== '').length;
    document.getElementById('progFill').style.width = Math.round(answered/data.questions.length*100) + '%';
  }

  async function submitQuiz(){
    const takerName = document.getElementById('takerName').value.trim();
    const btn = document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Submitting…';
    try{
      const r = await api('submitAttempt', { quizId, takerName, answers });
      if(!r.ok){ toast(r.error, true); btn.disabled=false; btn.textContent='Submit Quiz'; return; }
      shell('take', `
        <div class="container medium">
          <div class="card score-hero">
            ${pulseDivider()}
            <div class="big">${r.score} / ${r.total}</div>
            <p style="color:var(--text-dim);">${takerName ? escapeHtml(takerName)+', your' : 'Your'} score has been recorded.</p>
            <div class="hero-actions" style="margin-top:20px;">
              <span class="btn btn-ghost" onclick="go('#/')">Go to OMAC Quiz Launcher</span>
            </div>
          </div>
        </div>
      `);
    }catch(e){ toast('Network error.', true); btn.disabled=false; btn.textContent='Submit Quiz'; }
  }
}

/* ---------------- Router ---------------- */
function router(){
  const hash = location.hash || '#/';
  const takeMatch = hash.match(/^#\/quiz\/(.+)$/);
  if(takeMatch){ viewTakeQuiz(decodeURIComponent(takeMatch[1])); return; }
  switch(hash){
    case '#/': viewHome(); break;
    case '#/register': viewRegister(); break;
    case '#/login': viewLogin(); break;
    case '#/forgot': viewForgot(); break;
    case '#/dashboard': viewDashboard(); break;
    case '#/upload': viewUpload(); break;
    case '#/my-quizzes': viewMyQuizzes(); break;
    case '#/admin': viewAdmin(); break;
    default: viewHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', router);
